name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # нужно только для публикации релиза по тегу v*
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug and release APK
        run: gradle assembleDebug assembleRelease --stacktrace

      - name: Name APKs by version
        run: |
          VER=$(sed -n "s/.*versionName '\(.*\)'.*/\1/p" app/build.gradle)
          mkdir -p out
          cp app/build/outputs/apk/release/app-release.apk "out/OfflineMediaVault-$VER.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "out/OfflineMediaVault-$VER-debug.apk"
          ls -l out

      - uses: actions/upload-artifact@v4
        with:
          name: OfflineMediaVault-release-apk
          path: out/OfflineMediaVault-*[0-9].apk

      - uses: actions/upload-artifact@v4
        with:
          name: OfflineMediaVault-debug-apk
          path: out/OfflineMediaVault-*-debug.apk

      # git tag v3.0 && git push origin v3.0 → страница Releases с готовым APK
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: out/*.apk
          generate_release_notes: true
