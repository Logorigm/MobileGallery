plugins {
    id 'com.android.application'
}
android {
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }
    namespace 'com.example.offlinemediavault'
    compileSdk 35
    defaultConfig {
        applicationId 'com.example.offlinemediavault'
        minSdk 23
        targetSdk 35
        versionCode 2
        versionName '1.1'
    }
}
